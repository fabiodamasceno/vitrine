<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produtos dos vídeos</title><meta name="robots" content="index,follow">
<style>
:root{--bg:#16130F;--card:#2A241D;--accent:#FFD23F;--text:#FFFFFF}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:26px;margin:0 0 4px}.tagline{opacity:.75;margin:0 0 20px}
.video{background:var(--card);border-radius:14px;padding:16px;margin:0 0 14px;scroll-margin-top:12px}
.video:target{outline:2px solid var(--accent)}
.video h2{font-size:17px;margin:0 0 4px}.meta{font-size:13px;opacity:.65;margin:0 0 12px}
.meta a{color:inherit}
a.prod{display:block;text-decoration:none;color:var(--bg);background:var(--accent);border-radius:10px;padding:11px 14px;margin:8px 0;font-weight:600}
a.prod span{display:block;font-size:12px;font-weight:500;opacity:.8}
a.ch{display:block;background:var(--card);color:var(--text);text-decoration:none;border-radius:14px;padding:16px;margin:0 0 12px;font-weight:600}
footer{font-size:12px;opacity:.6;margin-top:28px}
</style></head><body><main>
<h1>Produtos dos vídeos</h1><p class="tagline">Escolha o canal</p>
<a class="ch" href="pausa-para-pensar/">Pausa pra Pensar</a>
<a class="ch" href="isso-aconteceu/">Isso Aconteceu</a>
<footer>Links de afiliado da Amazon: comprando por eles você apoia o canal sem pagar nada a mais. Como Associado da Amazon, o canal recebe por compras qualificadas. Preços e disponibilidade podem mudar.</footer>
</main></body></html>
